name: Generate Projects Panel


on:

  push:
    branches:
      - main
    paths:
      - "projects.json"
      - "logos/**"
      - ".github/scripts/**"


  schedule:
    - cron: "0 */6 * * *"


  workflow_dispatch:



jobs:

  generate:

    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.x"



      - name: Fetch GitHub Data

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run:

          python3 .github/scripts/fetch_data.py



      - name: Generate SVG

        run: |

          mkdir -p out

          python3 .github/scripts/generate_projects.py merged.json out



      - name: Deploy SVG

        uses: crazy-max/ghaction-github-pages@v4

        with:

          build_dir: out

          target_branch: projects

          commit_message: "Update projects panel"



        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
